<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poise motion</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#EAEAEA}
:root[data-theme="dark"],:root[data-theme="dark"] body{background:#2A2A2A}
html.pn,html.pn body{background:#F2F2F2}html.pn[data-theme="dark"],html.pn[data-theme="dark"] body{background:#161616}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
/*
  Feed thumbnail for Poise.
  The same ink figure the app draws for you while you work. It sits, then drifts the way people do
  at a desk: the head slides forward, the whole body comes close to the screen, it straightens up,
  leans back, tips to one side. The ground takes on the app's posture colour for each pose
  (gray when aligned, yellow for a drift, red when too close, green when it is fixed),
  and a chip above the head says what is happening right now in the app's own words (Slouching, Too close, Tilting...),
  the same way the light bar changes colour.
  ?ground=pn matches the case page panel. ?still=1 draws one aligned frame (for the static image).
*/
const Q = new URLSearchParams(location.search);
const GQ = Q.get('ground'), STILL = Q.get('still');
if (GQ === 'pn') document.documentElement.classList.add('pn');
const GROUND = GQ === 'pn' ? { light: [242, 242, 242], dark: [22, 22, 22] } : { light: [234, 234, 234], dark: [42, 42, 42] };
// Poise's posture colours (app.js)
const C = { amber: [240, 160, 32], red: [229, 72, 61], green: [79, 191, 115] };   // only yellow, red and green

/* ---------- the figure (from Poise figure.js, upper body only) ---------- */
function drawFigure(ctx, P, { j = () => 0, ink, paper }) {
  let n = 0;
  const jp = p => [p[0] + j(n++), p[1] + j(n++)];
  const poly = pts => { ctx.beginPath(); pts.map(jp).forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); ctx.lineJoin = 'round'; ctx.fill(); };
  const limb = (a, b, width) => {
    const A = jp(a), B = jp(b);
    ctx.lineCap = 'round';
    ctx.strokeStyle = ink; ctx.lineWidth = width + 4.5; ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke();
    ctx.strokeStyle = paper; ctx.lineWidth = width; ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke();
    ctx.strokeStyle = ink;
  };
  const drop = (P.drop || 0) + (P.breath || 0), hx = P.hx || 0, fwd = P.fwd || 0;
  const tb = P.tipBack || 0, sw = 1 - .12 * tb, sd = 9 * tb;
  const SL = [-40 * sw, -116 + drop + sd], SR = [40 * sw, -116 + drop + sd];
  const NECK = [hx * .35, -124 + drop + sd];
  ctx.save(); ctx.translate(0, -10); ctx.rotate(P.bend || 0); ctx.translate(0, 10);
  if (P.armsOnly) n = 23;   // skip the jitter the tee and head would have used, so redrawn arms land exactly on the first ones
  else {
  // tee
  ctx.fillStyle = ink;
  poly([[SL[0] - 2, SL[1] + 1], [NECK[0] - 11, NECK[1] + 7], [NECK[0] + 11, NECK[1] + 7], [SR[0] + 2, SR[1] + 1], [37 * (1 - .07 * tb), SR[1] + 22], [34, 60], [-34, 60], [-37 * (1 - .07 * tb), SL[1] + 22]]);
  // head
  const tilt = P.head || 0, neckLen = (38 - fwd * 14) * (1 - .3 * tb), hs = (1 + fwd * .14) * (1 - .12 * tb);
  const hX = NECK[0] + hx * .65 + Math.sin(tilt) * neckLen, hY = NECK[1] - Math.cos(tilt) * neckLen;
  limb(NECK, [NECK[0] + (hX - NECK[0]) * .42, NECK[1] + (hY - NECK[1]) * .42], 13);
  ctx.save();
  ctx.translate(hX, hY); ctx.rotate(tilt); ctx.scale(hs, hs);
  ctx.fillStyle = paper; ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(j(n++, .5), j(n++, .5), 19, 23, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.ellipse(0, 0, 20.5, 24.5, 0, Math.PI * 1.02, Math.PI * 1.98);
  ctx.quadraticCurveTo(14, -10 - 7 * tb + j(n++, .6), 4, -11 - 7 * tb); ctx.quadraticCurveTo(-8, -9 - 7 * tb, -20, -3 - 4 * tb); ctx.fill();
  ctx.lineWidth = 1.8;
  if (tb) ctx.translate(0, -5 * tb);
  ctx.beginPath();
  ctx.moveTo(-11, 0); ctx.quadraticCurveTo(-7, 3, -3, 0);
  ctx.moveTo(4, 0); ctx.quadraticCurveTo(8, 3, 12, 0);
  ctx.moveTo(1, 4); ctx.lineTo(0, 9); ctx.stroke();
  ctx.restore();
  }
  // arms resting on the desk
  // arms hang from just below the shoulder line, so the top of the arm sits flush with the tee
  for (const [s0, e, w] of [[[SR[0], SR[1] + 7], P.eR, P.wR], [[SL[0], SL[1] + 7], P.eL, P.wL]]) {
    const el = [e[0], e[1] + drop], wr = [w[0], w[1] + drop];
    limb(s0, el, 11); limb(el, wr, 9);
    ctx.fillStyle = paper; ctx.strokeStyle = ink; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(wr[0] + j(n++, .6), wr[1] + j(n++, .6), 5.5, 7.5, Math.atan2(wr[1] - el[1], wr[0] - el[0]) - Math.PI / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- the loop: poses, how long each holds, and its colour ---------- */
const ARMS = { eL: [-60, -70], wL: [-34, -22], eR: [60, -70], wR: [34, -22] };   // forearms reach down to the keyboard on the desk
const Z = { fwd: 0, zoom: 1, tipBack: 0, bend: 0, head: 0, hx: 0, drop: 0 };
const POSES = [
  { p: {}, c: null, label: 'Aligned', hold: 2.2 },
  { p: { fwd: 1, drop: 14, head: .1 }, c: 'amber', label: 'Slouching', hold: 1.9 },
  { p: { fwd: .8, zoom: 1.16, drop: 6, head: .06 }, c: 'red', label: 'Too close', hold: 1.9 },
  { p: {}, c: 'green', label: 'Back in balance', hold: 1.2 },
  { p: {}, c: null, label: 'Aligned', hold: 1.4 },
  { p: { tipBack: 1 }, c: 'amber', label: 'Too far', hold: 1.9 },
  { p: {}, c: null, label: 'Aligned', hold: 1.4 },
  { p: { bend: .2, head: -.12, hx: -6 }, c: 'amber', label: 'Tilting', hold: 1.9 },
  { p: {}, c: 'green', label: 'Back in balance', hold: 1.2 },
];
const MOVE = 1.15;   // seconds to move between poses
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const total = POSES.reduce((s, x) => s + x.hold + MOVE, 0);

function stateAt(time) {
  let t = time % total;
  for (let i = 0; i < POSES.length; i++) {
    const A = POSES[i], B = POSES[(i + 1) % POSES.length];
    if (t < A.hold) return mix(A, A, 0);
    t -= A.hold;
    if (t < MOVE) return mix(A, B, ease(t / MOVE));
    t -= MOVE;
  }
  return mix(POSES[0], POSES[0], 0);
}
function mix(A, B, k) {
  const pa = { ...Z, ...A.p }, pb = { ...Z, ...B.p }, out = {};
  for (const key in Z) out[key] = lerp(pa[key], pb[key], k);
  // colour strength: 0 for gray, 1 for a posture colour; the hue moves with it
  const ca = A.c ? C[A.c] : null, cb = B.c ? C[B.c] : null;
  const col = ca && cb ? ca.map((v, i) => lerp(v, cb[i], k)) : (ca || cb || C.green);
  out.col = col; out.amt = lerp(A.c ? 1 : 0, B.c ? 1 : 0, k);
  // the chip shows the nearer pose, fading out and back in as the label changes
  const near = k < .5 ? A : B;
  out.label = near.label; out.dot = near.c ? C[near.c] : null;
  out.chipA = A.label === B.label ? 1 : Math.min(1, Math.abs(k - .5) * 2.5);
  return out;
}

/* ---------- drawing ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, dark = false, t0 = performance.now();
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();
const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(',')},${a})`;
const blend = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
let seed = 0;
const jit = (i, amp = .9) => { const x = Math.sin((i + 1) * 12.9898 + seed * 78.233) * 43758.5453; return (x - Math.floor(x) - .5) * 2 * amp; };

function frame(now) {
  if (!STILL) requestAnimationFrame(frame);
  const time = STILL ? (parseFloat(Q.get('t')) || 0) : (now - t0) / 1000;
  seed = STILL ? 0 : Math.floor(now / 240);
  const S = stateAt(time), g = dark ? GROUND.dark : GROUND.light;

  // ground: gray, washed with the posture colour, plus a soft glow behind the figure (like the app's card)
  const base = blend(g, S.col, S.amt * (dark ? .16 : .3));
  ctx.fillStyle = rgb(base); ctx.fillRect(0, 0, W, H);
  if (S.amt > .01) {
    const R = Math.max(W, H) * .62, gx = W / 2, gy = H * .38;
    const gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, R);
    const glow = dark ? blend(S.col, [0, 0, 0], .25) : blend(S.col, [255, 255, 255], .35);
    gr.addColorStop(0, rgb(glow, (dark ? .3 : .55) * S.amt)); gr.addColorStop(1, rgb(glow, 0));
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }

  // framing: upper body, cut at the waist by the bottom edge, like the camera view in the app
  const fitW = 205, fitH = GQ === 'pn' || W / H > 1.6 ? 290 : 236, s = Math.min(W / fitW, H / fitH);
  const ax = W / 2, ay = H + s * 4;   // waist just below the bottom edge; the desk covers the lower body
  const ink = '#141412', paper = '#FBFAF6';   // the app's ink figure, in both themes

  // where you sat when you saved your reference: a faint dashed outline
  ctx.save(); ctx.translate(ax, ay); ctx.scale(s, s); ctx.translate(0, -30);
  ctx.setLineDash([5, 5]); ctx.lineDashOffset = -time * 6;
  ctx.strokeStyle = dark ? 'rgba(237,237,237,.3)' : 'rgba(13,13,13,.26)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(0, -162, 22, 26, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  // traced around the aligned figure, about 3 units outside it: neck, over the shoulder joint,
  // down the upper arm, around the elbow and along the forearm to the desk
  // a calm, flat outline: straight across the shoulders, a soft corner, then down the arms
  for (const m of [-1, 1]) {
    ctx.moveTo(10.5 * m, -136); ctx.lineTo(10.5 * m, -124);
    ctx.quadraticCurveTo(12 * m, -119, 22 * m, -119);
    ctx.lineTo(42 * m, -119);
    ctx.quadraticCurveTo(52 * m, -119, 54 * m, -110);
    ctx.lineTo(70 * m, -74);
    ctx.quadraticCurveTo(73 * m, -66, 68 * m, -58);
    ctx.lineTo(42 * m, -14);
  }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // you: closer grows around the chest
  const zoom = S.zoom, breath = STILL ? 0 : Math.sin(time * 1.4) * 1.2;
  ctx.save(); ctx.translate(ax, ay + s * -130 * (1 - zoom)); ctx.scale(s * zoom, s * zoom); ctx.translate(0, -30);
  drawFigure(ctx, { ...ARMS, ...S, breath }, { j: jit, ink, paper });
  ctx.restore();

  // the desk in front: the same gray as the ground, told apart only by its edge line.
  // Every line here uses the figure's own stroke (2.4 units), so the whole drawing has one weight.
  const lw = 2.4 * s, deskY = ay - s * 62, dInk = dark ? '#D8D8D6' : ink;
  ctx.fillStyle = rgb(base); ctx.fillRect(0, deskY, W, H - deskY);
  ctx.strokeStyle = dInk; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, deskY); ctx.lineTo(W, deskY); ctx.stroke();
  // keyboard: a flat rounded slab with short rounded keys, clean like a Notion illustration
  const kw = s * 128, kh = s * 32, kx = ax - kw / 2, ky = deskY + s * 8;
  ctx.fillStyle = dark ? '#2F2F31' : paper;
  ctx.beginPath(); ctx.roundRect(kx, ky, kw, kh, s * 6); ctx.fill(); ctx.stroke();
  const rows = [[7], [8]], key = s * 7, step = s * 13;   // seen from across the desk: the person's space bar is nearest them, so it sits at the top
  rows.forEach(([n, off], r) => {
    const y = ky + s * (16 + r * 7.5), x0 = ax - ((n - 1) * step) / 2;
    for (let i = 0; i < n; i++) { const x = x0 + i * step; ctx.beginPath(); ctx.moveTo(x - key / 2, y); ctx.lineTo(x + key / 2, y); ctx.stroke(); }
  });
  ctx.beginPath(); ctx.moveTo(ax - s * 24, ky + s * 8.5); ctx.lineTo(ax + s * 24, ky + s * 8.5); ctx.stroke();   // space bar
  // the forearms and hands come back on top of the desk (a little above its edge, so the edge line
  // never shows through the arms), resting on the keyboard
  ctx.save(); ctx.beginPath(); ctx.rect(0, deskY - lw, W, H - deskY + lw); ctx.clip();
  ctx.translate(ax, ay + s * -130 * (1 - zoom)); ctx.scale(s * zoom, s * zoom); ctx.translate(0, -30);
  drawFigure(ctx, { ...ARMS, ...S, breath, armsOnly: true }, { j: jit, ink, paper });
  ctx.restore();

  // live status chip above the head: a dot in the posture colour and what is happening right now
  const fs = Math.max(11, Math.min(22, s * 8.2)), headTop = ay - s * 222;
  const cy = Math.max(fs * 1.9, headTop - s * 34);
  ctx.font = `500 ${fs}px Geist, 'Helvetica Neue', Arial, sans-serif`;
  const tw = ctx.measureText(S.label).width, dotR = fs * .3, padX = fs * .9, gap = fs * .55;
  const cw = padX * 2 + dotR * 2 + gap + tw, ch = fs * 2.1, cx = ax - cw / 2;
  ctx.globalAlpha = S.chipA;
  ctx.fillStyle = dark ? 'rgba(24,24,26,.82)' : 'rgba(255,255,255,.88)';
  ctx.beginPath(); ctx.roundRect(cx, cy - ch / 2, cw, ch, ch / 2); ctx.fill();
  const pulse = STILL ? 1 : .75 + .25 * Math.sin(time * 4);
  ctx.fillStyle = S.dot ? rgb(S.dot) : (dark ? '#8C8D92' : '#9A9A9A');
  ctx.beginPath(); ctx.arc(cx + padX + dotR, cy, dotR * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = dark ? '#EDEDED' : '#141412'; ctx.textBaseline = 'middle';
  ctx.fillText(S.label, cx + padX + dotR * 2 + gap, cy + fs * .04);
  ctx.globalAlpha = 1;
}

// follow the portfolio's theme (same rule as the other thumbnails)
function theme() {
  let d = false;
  try { const r = parent.document.documentElement; d = r.dataset.theme ? r.dataset.theme === 'dark' : parent.matchMedia('(prefers-color-scheme: dark)').matches; }
  catch (_) { d = matchMedia('(prefers-color-scheme: dark)').matches; }
  const q = Q.get('theme'); if (q) d = q === 'dark';
  if (d !== dark) { dark = d; document.documentElement.dataset.theme = d ? 'dark' : 'light'; if (STILL) frame(performance.now()); }
}
theme(); setInterval(theme, 500);
if (document.fonts) document.fonts.load('500 16px Geist').then(() => { if (STILL) frame(performance.now()); });
requestAnimationFrame(frame);
</script>
</body>
</html>
